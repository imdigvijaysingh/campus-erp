# /etc/pgbouncer/pgbouncer.ini
# Transaction-Mode Connection Pooling Supervisor (Workstream 2.1)

[databases]
erp_production = host=127.0.0.1 port=5432 dbname=erp_production

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Transaction-level pooling maximizes concurrency without thread-starvation
pool_mode = transaction

max_client_conn = 10000
default_pool_size = 50
reserve_pool_size = 15
reserve_pool_timeout = 2
server_idle_timeout = 60
client_idle_timeout = 30
query_timeout = 5
server_connect_timeout = 2
server_login_retry = 1
so_reuseport = 1
