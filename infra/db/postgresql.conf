# postgresql.conf
# Database Engine Safeguards & Zero-Data-Loss Invariants (Workstream 2.2)

# 1. Deterministic Lock & Deadlock Mitigation
deadlock_timeout = 100ms
statement_timeout = 2500ms
idle_in_transaction_session_timeout = 5000ms
lock_timeout = 2000ms

# 2. Strict WAL fsync & Synchronous Commit for RPO = 0
wal_sync_method = fdatasync
synchronous_commit = on
wal_level = replica
max_wal_senders = 10
wal_keep_size = 4096MB

# 3. Temp File Allocation Limits (Prevents unbounded disk fill)
temp_file_limit = 1048576 # 1GB Max temp file space per query
work_mem = 16MB
maintenance_work_mem = 256MB

# 4. Connection & Checkpoint Tuning
max_connections = 200
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
