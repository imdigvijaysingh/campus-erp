# nginx-edge.conf
# Edge Ingress, Opaque Error Interception & Cryptographic Transport Hardening (Workstream 1.2 & 1.3)

upstream backend_nodes {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.shyvora.internal erp.shyvora.com;

    # Enforce immediate HTTPS redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.shyvora.internal erp.shyvora.com;

    # 1. Strict TLS 1.3 Only Cryptographic Hardening
    ssl_certificate /etc/ssl/certs/shyvora_chain.pem;
    ssl_certificate_key /etc/ssl/private/shyvora_key.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # 2. HSTS Preload & Transport Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 3. OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 4. Opaque 5xx Error Masking at Edge
    proxy_intercept_errors on;
    error_page 500 502 503 504 /error_sanitized.json;

    location = /error_sanitized.json {
        internal;
        default_type application/json;
        return 500 '{"status": 500, "code": "SERVICE_FAULT", "message": "An unexpected system fault occurred. Our engineering operations team has been notified.", "traceId": "$request_id"}';
    }

    # 5. Core API Reverse Proxy with Trace-ID Forwarding
    location / {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Trace-Id $request_id;

        # Call Budget & Timeouts
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # Buffer sizing to prevent memory ballooning
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }
}
