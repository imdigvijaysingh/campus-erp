# pod-security-hardened.yaml
# Container Immutability & OS Sandboxing (Workstream 3.1)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api-service
  namespace: default
  labels:
    app: erp-api
    tier: backend
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: erp-api
  template:
    metadata:
      labels:
        app: erp-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: shyvora-registry.internal/erp-api:v2.4.0
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        ports:
        - containerPort: 5000
          name: http
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "2000m"
            memory: "2048Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 2
        volumeMounts:
        - name: ephemeral-tmp
          mountPath: /tmp
      volumes:
      - name: ephemeral-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
