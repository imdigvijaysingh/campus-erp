# /etc/sysctl.d/99-cyber-resilience.conf
# Linux Kernel Security, Core Dump Zeroing & DDoS Immunity

# Workstream 0.1: Core Dump Zeroing
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# Workstream 4.1: Edge Rate-Limiting & Layer 3/4 Flood Mitigation
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 262144
net.core.netdev_max_backlog = 100000
net.core.somaxconn = 65535

# TCP FIN Timeout & Connection Recycling (Prevents SYN/TIME-WAIT starvation)
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Memory Overcommit Protection
vm.overcommit_memory = 2
vm.overcommit_ratio = 80
vm.panic_on_oom = 0
