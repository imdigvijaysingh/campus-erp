# coraza-anomaly-scoring.conf
# Coraza / ModSecurity WAF Anomaly Scoring & Fail-Secure Policy

# Enable WAF Engine in blocking mode
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576

# Default Anomaly Thresholds
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# Emergency False-Positive Rule Exclusion Protocol (Section 4)
# When a legitimate integration encounters a false positive, do NOT disable the WAF.
# Apply targeted rule bypass based on URI and cryptographic HMAC / mutual auth:
SecRule REQUEST_URI "@beginsWith /api/v1/verified-callback" \
    "id:990001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"

# Correlated Audit Logging of Blocked Requests
SecDefaultAction "phase:2,deny,status:403,log,auditlog"
